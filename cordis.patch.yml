# ============================================================================
# dsh-xhs-scroll —— 插件自带的挂载声明（bundle patch）
# ============================================================================
# 装上之后 profile 只要在 `dsh.profile.bundles` 里列出本包名即生效。
# 真正的用户配置在插件自己的 config 里（设置页可改），这里只放默认值。
#
#   dsh plugin --profile desktop add link:<插件目录>
# ============================================================================

- insert:
    - id: xhs-scroll
      name: dsh-xhs-scroll
      config:
        enabled: true
